<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPolimdo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Tech Accents -->
  <circle cx="100" cy="100" r="92" fill="#0b192c" stroke="url(#gradPolimdo)" stroke-width="5" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gradGold)" stroke-width="2" stroke-dasharray="8 4" opacity="0.8" />
  
  <!-- Gear teeth / Engineering Polygon -->
  <g fill="none" stroke="url(#gradCyan)" stroke-width="2.5" opacity="0.6">
    <circle cx="100" cy="100" r="70" />
    <path d="M100 15 L100 30 M100 170 L100 185 M15 100 L30 100 M170 100 L185 100" />
    <path d="M40 40 L50 50 M150 150 L160 160 M160 40 L150 50 M40 160 L50 150" />
  </g>

  <!-- Central Shield / Pentagram of Education -->
  <polygon points="100,32 158,54 148,138 100,165 52,138 42,54" fill="url(#gradPolimdo)" stroke="url(#gradGold)" stroke-width="3" />

  <!-- Electrical Lightning Bolt & Circuit Spark -->
  <path d="M106 48 L82 98 L104 98 L94 148 L124 92 L102 92 Z" fill="url(#gradGold)" filter="url(#glow)" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Circuit Nodes & Lines -->
  <circle cx="70" cy="75" r="4" fill="#38bdf8" />
  <circle cx="130" cy="75" r="4" fill="#38bdf8" />
  <circle cx="75" cy="125" r="4" fill="#38bdf8" />
  <circle cx="125" cy="125" r="4" fill="#38bdf8" />
  <line x1="70" y1="75" x2="84" y2="85" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="130" y1="75" x2="116" y2="85" stroke="#38bdf8" stroke-width="1.5" />

  <!-- POLIMDO Label -->
  <text x="100" y="180" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">POLIMDO</text>
  <text x="100" y="193" font-family="'Inter', sans-serif" font-weight="700" font-size="7" fill="#fbbf24" text-anchor="middle" letter-spacing="1">D4 TEKNIK LISTRIK</text>
</svg>
